# Shopping Hub crawl configuration.
# Edit freely -- reloaded on every crawl run, no restart needed.

crawl:
  # Global politeness. Per-site overrides below win.
  default_delay_seconds: 2.5
  default_concurrency: 2
  max_pages_per_keyword: 5
  request_timeout: 45
  retries: 3

  # Seed keywords crawled on every scheduled sweep. This is what populates the DB.
  keywords:
    - bluetooth earbuds
    - usb c hub
    - mini pc
    - led strip light
    - power bank 20000mah
    - dash cam
    - smart watch
    - 3d printer filament
    - soldering station
    - security camera wifi

sites:
  aliexpress:
    enabled: true
    # Search ships a complete JSON blob over plain HTTP; the product page is a
    # JS shell with no attributes in the HTML, so only detail needs a browser.
    render_detail: browser
    delay_seconds: 3.0
    # Confirmed live 2026-09-08: with ALIEXPRESS_APP_KEY/SECRET set, the admin
    # "Crawl" button and `crawl --categories` walk the real category tree
    # (524 leaf categories via aliexpress.affiliate.category.get) instead of
    # sweeping config.yaml's keyword list -- see category_seeds()/
    # crawl_category() in scrapers/aliexpress.py. Without those credentials
    # this adapter has no category concept at all and stays keyword-only.
    concurrency: 2
    # Colour/size/length pickers only exist as DOM elements now -- AliExpress's
    # own runParams blob ships empty (isCSR: true), so per-SKU price and stock
    # only exist as a client-side update triggered by an actual click. This
    # clicks through every option combination on listings that have a picker at
    # all (most don't pay this cost). Set false if crawl time matters more than
    # per-variant pricing on this site.
    extract_variants: true
    ships_from_us_warehouse: true

  alibaba:
    enabled: true
    delay_seconds: 3.0
    concurrency: 2

  # --- the three domestic-China sites ---------------------------------------
  # These need either a logged-in browser session or an API provider. `driver` is
  # shorthand for a (search, detail) pair:
  #
  #   driver: browser    search=browser   detail=browser    (default, no API needed)
  #   driver: provider   search=provider  detail=provider   (fully unattended)
  #   driver: hybrid     search=browser   detail=provider   <-- usually the best
  #
  # Why hybrid: forwarding agents can look up an item but cannot search, and detail
  # fetching is where nearly all the traffic goes (one gated page per *product* vs
  # one per *results page*). Hybrid keeps discovery on the browser and moves the
  # expensive bulk onto the API.
  #
  # Set CN_PROVIDER_PRESET + CN_PROVIDER_KEY in .env and verify with:
  #     python -m sourcehub.cli provider-probe --preset otapi --site 1688
  #
  # Fine-grained control: `search_driver:` / `detail_driver:` override either half,
  # `provider_preset:` overrides the preset per site, and `detail_fallback: false`
  # stops the browser being used when a provider detail lookup comes back empty.
  # Anything requesting the provider silently degrades to browser if it can't do it.
  "1688":
    enabled: true
    # Same reasoning as taobao/tmall below: USFans' search/detail are already
    # generic per-site (provider_code "1" for 1688 in providers.yaml), so this
    # is the same discovery+enrichment path, just unverified against real
    # 1688 data yet -- confirm with a real crawl before trusting it.
    driver: provider
    provider_preset: usfans
    delay_seconds: 6.0
    concurrency: 1
    needs_agent: true      # cannot ship internationally without a forwarding agent

  taobao:
    enabled: true
    # `provider`, not `hybrid`: browser search on taobao.com itself is blocked
    # by Taobao's own anti-bot wall for anonymous/non-China traffic regardless
    # of any forwarding-agent login, and unavailable at all without a Taobao
    # account. USFans' own keyword search (confirmed live) covers discovery
    # instead, so both halves go through the provider here.
    driver: provider
    provider_preset: usfans
    delay_seconds: 6.0
    concurrency: 1
    needs_agent: true

  tmall:
    enabled: true
    driver: provider
    provider_preset: usfans
    delay_seconds: 6.0
    concurrency: 1
    needs_agent: true

  dhgate:
    enabled: true
    delay_seconds: 2.5
    concurrency: 2

  chinavasion:
    enabled: true      # discovery via the site's product sitemap
    delay_seconds: 2.0
    concurrency: 2

  globalsources:
    # Re-enabled 2026-09-07: the earlier "JS shell, no cards" diagnosis was
    # half right -- content does fully render (this needs render: browser),
    # but the site rewrote its frontend as a Vue SPA and every one of the
    # adapter's selectors (card wrapper, product URL shape, MOQ, supplier
    # name, verified badge) was matching markup that no longer exists.
    # Updated against the real live DOM in scrapers/globalsources.py.
    enabled: true
    render: browser
    delay_seconds: 3.0
    concurrency: 1

  madeinchina:
    enabled: true
    delay_seconds: 3.0
    concurrency: 2

  gearbest:
    # Disabled 2026-09-07, confirmed live: gearbest.ma sits behind a genuine
    # Cloudflare Turnstile challenge ("Verify you are human"), not a passive
    # block -- curl_cffi's TLS impersonation is already active (installed,
    # confirmed in use) and still gets HTTP 403, and a real, headed browser
    # (not headless scraping) hits the same interactive checkbox challenge.
    # Not a selector or fingerprinting problem to code around; would need
    # either a paid anti-bot-bypass proxy service or manual captcha solving,
    # neither of which this adapter should silently automate. Re-run
    # `selftest --site gearbest` occasionally to see if the site's posture
    # has changed.
    enabled: false
    delay_seconds: 2.5
    concurrency: 2

  # US retail baseline -- answers 'is importing actually cheaper?'. Uses the
  # free Browse API when EBAY_CLIENT_ID/SECRET are set, else the search page.
  ebay:
    enabled: true
    # eBay 403s plain HTTP scraping. With EBAY_CLIENT_ID/SECRET set the API is
    # used and this is ignored; without keys the browser fallback is the only
    # way the adapter returns anything.
    render: browser
    delay_seconds: 2.0
    concurrency: 2

  # Second US retail baseline: new, first-party inventory at a fixed price,
  # unlike eBay's mix of auctions and used lots. Pure API, no HTML fallback --
  # needs a free BESTBUY_API_KEY (https://developer.bestbuy.com), else skipped
  # entirely like octopart without Nexar credentials.
  bestbuy:
    enabled: true
    delay_seconds: 1.0
    concurrency: 2

  # Component distributors. These publish real manufacturer part numbers, so
  # matching uses the exact brand+MPN path rather than fuzzy titles.
  lcsc:
    # Re-enabled 2026-09-07: found the endpoint's new home (SEARCH_API in
    # scrapers/components.py) by hooking the live site's own Vue component
    # rather than guessing -- confirmed anonymously callable via curl.
    enabled: true
    delay_seconds: 2.0
    concurrency: 2

  octopart:
    enabled: true      # needs OCTOPART_CLIENT_ID/SECRET, else skipped
    delay_seconds: 2.0
    concurrency: 1

  tomtop:
    # Disabled, re-confirmed 2026-09-07: tomtop.com refuses the TCP
    # connection outright now (not just a TLS reset), confirmed across three
    # independent networks (this project's own curl_cffi client, a separate
    # browser sandbox, and Anthropic's own fetch infrastructure) -- a
    # site-level outage or takedown, not anything specific to this project's
    # network path or fingerprint. The adapter is written and correct;
    # re-enable and run `selftest --site tomtop` to see whether it has come
    # back.
    enabled: false
    delay_seconds: 2.5
    concurrency: 2

  geekbuying:
    enabled: true
    delay_seconds: 2.5
    concurrency: 2

  banggood:
    enabled: true
    render: browser      # cards render server-side but prices arrive by XHR
    delay_seconds: 2.5
    concurrency: 2

  temu:
    # Re-enabled 2026-09-07 -- built against a real HAR capture from a logged
    # in session (see scrapers/temu.py's docstring): search() reads the first
    # page of results straight out of window.rawData, no separate API call.
    # Needs a real logged-in session either way (an anonymous one hits a
    # mandatory sign-in wall within seconds) -- re-run
    # `python -m sourcehub.cli browser-login --site temu` if this starts
    # returning nothing (the saved session likely expired).
    #
    # NOT yet implemented: pagination past the first ~40 results per
    # keyword, and fetch_detail() (no product-page capture yet).
    enabled: true
    render: browser
    delay_seconds: 3.0
    concurrency: 1

  greetbuy:
    # Confirmed live 2026-09-07: fully anonymous, no login, no session --
    # see scrapers/greetbuy.py. 1688-only for now (no confirmed way to
    # switch its own "Taobao" search tab to a different channel).
    enabled: true
    delay_seconds: 3.0
    concurrency: 2

  liuhuamall:
    # Confirmed live 2026-09-07: its own independent catalog (not a
    # forwarding agent), fully anonymous search -- see scrapers/liuhuamall.py.
    enabled: true
    delay_seconds: 2.5
    concurrency: 2

  buckydrop:
    # Confirmed live 2026-09-07: search itself needs no login, but does need a
    # real browser session (an httpOnly cookie set just by visiting the site --
    # see scrapers/buckydrop.py, which calls it via BrowserSession.fetch_json()
    # rather than plain HTTP). Low concurrency: every search call opens a real
    # browser tab.
    enabled: true
    delay_seconds: 3.0
    concurrency: 1

matching:
  # Two offers merge into one canonical product when the weighted score clears this.
  auto_merge_threshold: 0.86
  # Between review_threshold and auto_merge_threshold they land in the review queue.
  review_threshold: 0.70
  weights:
    gtin: 1.00           # exact UPC/EAN/GTIN match -> instant merge, skips everything else
    mpn: 0.92            # brand + manufacturer part number
    image_phash: 0.45    # perceptual hash distance on primary images
    title: 0.35          # normalized token-set similarity
    specs: 0.20          # overlapping spec key/value agreement
  image_phash_max_distance: 10

translation:
  # Fields sent to the translation provider. Everything is cached by content hash,
  # so re-crawling the same listing costs nothing.
  fields: [title, spec_key, spec_value, description, shipping_note]
  batch_size: 40
  source_languages: [zh, zh-CN, zh-TW, ja, ko, ru, es, auto]

schedule:
  # APScheduler cron expressions.
  full_crawl: "0 3 * * *"        # 03:00 daily - full keyword sweep
  refresh_prices: "0 */6 * * *"  # every 6h - re-price known offers only
  fx_rates: "30 2 * * *"         # daily FX refresh
  rematch: "0 5 * * 0"           # weekly re-run of the matcher over unmatched offers
  health_check: "0 7 * * *"      # daily adapter health log
  retention: "0 4 * * 0"         # weekly backup + reclaim (see retention: below)

# ----------------------------------------------------------------- retention
# Nothing else in this app ever deletes anything, and an instance left running
# grows forever: one price point per listing per refresh, plus image files that
# no row references after a merge or a failed ingest.
#
# This pass backs up first and reclaims second, so the snapshot is always the one
# that still has whatever the reclaim removed. It runs on the `retention` cron
# above, or by hand with `python -m sourcehub.cli retention`.
retention:
  # Keep roughly a year of price points, so the product-page chart still shows a
  # seasonal cycle. The newest point for a listing is never deleted whatever its
  # age -- otherwise a listing nobody re-prices would lose its price entirely.
  price_history_days: 400
  # Delete image records whose listing is gone, then sweep files on disk that no
  # record points at. Files are matched against surviving records rather than
  # deleted per-record, because images are shared between rows by content hash.
  orphan_media: true
  # SQLite does not hand freed pages back to the filesystem on its own.
  vacuum: true
  # Snapshots to keep in data/backups. 0 turns backups off.
  backups: 7
  backup_dir: ""

# --------------------------------------------------------------- live search
# Searching for something nobody has crawled yet kicks off a crawl for it, in the
# background. The search itself never waits.
#
# The defaults are deliberately timid, because this wires a public input box to
# eleven marketplaces. Raise them only if you have a proxy and know what your
# rate limits are.
live_search:
  enabled: true
  # Only crawl when the catalogue has fewer than this many local matches. A query
  # that already has good answers should not touch the network.
  min_results: 5
  # Do not crawl the same keyword again within this many hours, however many
  # times it is searched. Survives restarts.
  cooldown_hours: 24
  # Shallow on purpose: results should appear in a minute, not twenty. The
  # scheduled full crawl deepens whatever proves popular.
  max_pages: 1
  fetch_details: false
  # Ignore very short queries; "us" is not worth eleven site hits.
  min_chars: 3
  # Reject new work past this queue depth rather than growing unboundedly.
  max_queue: 20
  # Crawls one caller may start per hour. cooldown_hours stops the same keyword
  # repeating; this stops one client asking for a hundred different ones and
  # owning the worker all afternoon. Only requests that would really start a
  # crawl count -- repeats and cooled-down keywords are free. 0 disables it.
  #
  # Callers are identified by source address. Behind a reverse proxy every
  # request looks like it came from the proxy, so set SOURCEHUB_TRUST_PROXY=true
  # to read X-Forwarded-For instead -- but only if that proxy is yours, since
  # the header is otherwise whatever the client typed.
  per_client_hourly: 6
  # Which sites to hit on demand. Empty means every enabled site. Narrowing this
  # to the fast HTTP-only adapters makes results appear sooner.
  sites: []
