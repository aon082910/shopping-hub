# Import duty estimation -- OFF by default, and deliberately so.
#
# Duty depends on the HTS classification of the specific good, on origin, on trade
# programme, and on rules that change. This project cannot pick those numbers for
# you responsibly, so it ships with no rates and says plainly that duty is not
# included, rather than inventing a figure that looks authoritative.
#
# To switch it on: look the rates up from a source you trust (the USITC HTS, a
# customs broker, your freight forwarder), enter them below, and stamp `as_of` with
# the date you checked. The UI shows that date next to every estimate, so a stale
# table is visible rather than silently wrong.
#
# Nothing here is tax advice, and an estimate is not a customs ruling.

enabled: true

as_of: "2026-09-07"
source: >
  CBP rulings N361412 (2026-05-27), HQ H348342 (2026-05-08), N363956
  (2026-08-06), N363313 (2026-07-29), N363514 (2026-08-05), N363251
  (2026-07-28), N363423 (2026-07-30) -- base HTS rates only, Section
  301/trade-remedy surcharges NOT included, see note below.

# Applied when no category rule matches. 0.0 means "no duty assumed".
default_rate: 0.0

# Shipments valued under this are treated as duty-free. Leave null unless you have
# confirmed the current treatment for your origin and goods -- de minimis handling
# for China-origin shipments has changed more than once.
de_minimis_usd: null

# Category path prefix -> ad valorem rate (0.075 = 7.5%). Longest prefix wins, so a
# leaf rule beats its parent. Paths match the browse taxonomy in db/seed.py.
by_category:
  computers/usb-hubs-docks: 0.0     # HQ H348342: USB hubs, HTS 8471.80.10, general duty rate Free
  tools/measuring-test-equipment: 0.053  # N363956: tape measure, HTS 9017.80.0000
  tools/hand-tools: 0.053           # N363313: tire repair kit, HTS 8205.59.5560
  # Both N363514 (racing sim kit) and N363251 (huupe ARENA basketball
  # tracker) independently land on the same HTS 9504.50.0000 ("video game
  # consoles and machines... and parts/accessories"), Free.
  toys/gaming-accessories: 0.0
  packaging/shipping-supplies: 0.03  # N363423: polyethylene foam packaging inserts, HTS 3923.90.0080
  # electronics: 0.00
  # apparel: 0.16
  # apparel/shoes: 0.20

note: >
  Estimates only, and BASE HTS RATES ONLY -- Section 301 and any current
  reciprocal-tariff surcharge on China-origin goods are NOT included (both
  source rulings explicitly say so). Real landed duty on China-origin goods
  is very likely higher than these figures. Freight, insurance, customs
  brokerage, merchandise processing and harbor maintenance fees are also
  not included.
